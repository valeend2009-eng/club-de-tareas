<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Club de Tareas - Reserva de Clases</title>
    <style>
        :root { --primary-color: #006633; }
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 20px; }
        .cell { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; }
        .cell.header { background: var(--primary-color); color: white; font-weight: bold; }
        .cell.selected { background: #28a745; color: white; }
        .btn-pay { background: #009ee3; color: white; padding: 15px; border: none; width: 100%; margin-top: 20px; border-radius: 5px; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Club de Tareas</h1>
    <p>Consultas: <strong>2804622107</strong></p>
    
    <div>
        <label>Nombre:</label><input type="text" id="name" required><br>
        <label>Email:</label><input type="email" id="email" required><br>
        <label>Celular:</label><input type="tel" id="phone" required><br>
        <label>Nivel:</label>
        <select id="level" onchange="calculate()">
            <option value="12500">Primaria ($12.500)</option>
            <option value="15000">Secundaria ($15.000)</option>
        </select>
    </div>

    <h3>Seleccioná tus horarios:</h3>
    <div class="grid" id="calendar">
        <!-- Generado por JS -->
    </div>

    <div style="margin-top:20px; font-size: 1.5rem;">
        Total: $<span id="total">0</span>
    </div>
    
    <button class="btn-pay" onclick="goToPayment()">Pagar con Mercado Pago</button>
</div>

<script>
    let selectedSlots = [];
    const days = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie'];
    const hours = ['09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00', '17:00'];

    function buildCalendar() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = '<div class="cell header">Hora</div>' + days.map(d => `<div class="cell header">${d}</div>`).join('');
        
        hours.forEach(h => {
            cal.innerHTML += `<div class="cell"><strong>${h}</strong></div>`;
            days.forEach((d, i) => {
                cal.innerHTML += `<div class="cell" onclick="toggle(this, '${d}', '${h}')">${h}</div>`;
            });
        });
    }

    function toggle(el, d, h) {
        el.classList.toggle('selected');
        const id = d + h;
        if(selectedSlots.includes(id)) selectedSlots = selectedSlots.filter(s => s !== id);
        else selectedSlots.push(id);
        calculate();
    }

    function calculate() {
        const price = document.getElementById('level').value;
        document.getElementById('total').innerText = (selectedSlots.length * price).toLocaleString();
    }

    function goToPayment() {
        const total = document.getElementById('total').innerText.replace(/\./g, '');
        // AQUÍ DEBÉS PEGAR EL LINK DE PAGO DE MERCADO PAGO
        // Ejemplo: window.location.href = "https://www.mercadopago.com.ar/checkout/v1/redirect?pref_id=TU_ID";
        alert("Redirigiendo a Mercado Pago para abonar $" + total);
    }

    buildCalendar();
</script>
</body>
</html>
